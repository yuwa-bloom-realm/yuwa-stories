<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゆわの魔法図書館｜入口</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", serif;
    background: linear-gradient(180deg, #fdf9f3 0%, #f6eefc 100%);
    color: #4a3f55;
    line-height: 1.9;
    padding: 48px 20px 56px;
  }
  .wrap { max-width: 520px; margin: 0 auto; text-align: center; }
  .door { font-size: 2.6rem; margin-bottom: 6px; }
  .library-name { font-size: 0.85rem; letter-spacing: 0.3em; color: #9b7ed9; }
  h1 { font-size: 1.65rem; font-weight: normal; letter-spacing: 0.1em; margin: 8px 0 18px; }
  .lead { font-size: 0.97rem; color: #5d4e74; margin-bottom: 30px; }
  .join-btn {
    display: inline-block; text-decoration: none;
    background: #06c755; color: #fff;
    font-family: "Hiragino Sans", sans-serif; font-size: 1.05rem;
    padding: 15px 40px; border-radius: 999px;
    box-shadow: 0 3px 12px rgba(6, 199, 85, 0.3);
  }
  .join-note { font-size: 0.82rem; color: #8a76ad; margin-top: 12px; }
  .about {
    margin-top: 44px; text-align: left;
    background: #ffffff; border: 1px solid #e8ddf5; border-radius: 14px;
    padding: 22px 24px;
    box-shadow: 0 2px 10px rgba(155, 126, 217, 0.08);
    font-size: 0.93rem; color: #5d4e74;
  }
  .about h2 {
    font-size: 0.95rem; font-weight: normal; letter-spacing: 0.2em;
    color: #9b7ed9; text-align: center; margin-bottom: 10px;
  }
  footer {
    margin-top: 40px; font-size: 0.85rem; color: #6b5b7e; line-height: 2.0;
  }
  footer .name { letter-spacing: 0.2em; color: #4a3f55; }
</style>
</head>
<body>
<div class="wrap">
  <div class="door">📚</div>
  <div class="library-name">ゆわの魔法図書館</div>
  <h1>図書館の入口</h1>
  <p class="lead">ここは、短編物語が並ぶ小さな図書館です。<br>疲れた日に、そっと開ける場所。<br>物語は、図書館の中で読めます。</p>

  <a class="join-btn" href="https://line.me/ti/g2/JLE5DC_IjliePPb9tKLrPhVyAReacddikiOvPw">図書館に入る</a>
  <p class="join-note">LINEオープンチャットに移動します<br>参加は無料、ニックネームで大丈夫です</p>

  <div class="about">
    <h2>この図書館について</h2>
    <p>桜庭ゆわの短編物語を、少しずつ置いていく場所です。新しい物語を置いたときや、朗読会のお知らせは、図書館の中で届きます。感想を置いていくのも歓迎です。静かに読みたい方は、読むだけでもどうぞ。</p>
  </div>

  <footer>
    物語を書いている人<br>
    <span class="name">桜庭ゆわ</span>
  </footer>
</div>
